name: Sync Jira data

on:
  # The hourly schedule is DISABLED as of 2026-09-17.
  #
  # Basic-auth API tokens appear to be blocked for the autodesk.atlassian.net
  # tenant: three separate freshly minted tokens were each rejected with 401 on
  # Jira, Confluence and api.atlassian.com/me, while OAuth access to the same
  # account works fine. So fetch_jira.py cannot authenticate, and since it now
  # (correctly) aborts rather than writing zeros, every scheduled run would fail
  # and email a failure notice without ever producing data.
  #
  # Re-enable by uncommenting the two lines below once the auth question is
  # resolved with the Atlassian admins -- do not just mint another token, that
  # has been tried three times.
  #
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:        # still runnable on demand from the Actions tab

concurrency:
  group: sync-jira
  cancel-in-progress: false

permissions:
  contents: write           # needed to push the regenerated docs/data.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Jira metrics
        env:
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python3 scripts/fetch_jira.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data.json; then
            echo "No change in Jira numbers — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Auto-sync Jira data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
